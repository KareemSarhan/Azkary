name: Self-Hosted APK

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build signed self-hosted APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -d > app/keystore.jks

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | grep -o '"[^"]*"' | head -1 | tr -d '"')
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | grep -o '[0-9]\+' | head -1)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed self-hosted APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleSelfHostedRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Rename APK
        run: |
          VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
          VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"
          mv app/build/outputs/apk/selfHosted/release/app-selfHosted-release.apk \
            "app/build/outputs/apk/selfHosted/release/Azkary-v${VERSION_NAME}-${VERSION_CODE}-selfHosted-release.apk"
          sha256sum "app/build/outputs/apk/selfHosted/release/Azkary-v${VERSION_NAME}-${VERSION_CODE}-selfHosted-release.apk" \
            > "app/build/outputs/apk/selfHosted/release/Azkary-v${VERSION_NAME}-${VERSION_CODE}-selfHosted-release.apk.sha256"

      - name: Upload self-hosted APK
        uses: actions/upload-artifact@v7
        with:
          name: Azkary-self-hosted-apk
          path: |
            app/build/outputs/apk/selfHosted/release/Azkary-v*-selfHosted-release.apk
            app/build/outputs/apk/selfHosted/release/Azkary-v*-selfHosted-release.apk.sha256

      - name: Clean up keystore
        if: always()
        run: rm -f app/keystore.jks
